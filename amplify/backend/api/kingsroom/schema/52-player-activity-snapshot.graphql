# 52-player-activity-snapshot.graphql
# ===================================================================
# PLAYER ACTIVITY SNAPSHOT - Trending & Analytics
# ===================================================================
# Stores point-in-time snapshots of player classifications and categories
# for week-on-week and month-on-month trending analysis.
#
# Generated by: refreshTargetingClassifications Lambda
# Consumed by: metricsPackGenerator for AI report generation
#
# ID Formats:
#   - DAILY_YYYY-MM-DD (e.g., "DAILY_2025-02-01")
#   - WEEKLY_YYYY-Www (e.g., "WEEKLY_2025-W05")
#   - MONTHLY_YYYY-MM (e.g., "MONTHLY_2025-02")
#
# REQUIRES: SnapshotPeriodType enum in 00-enums.graphql
#
# VERSION: 1.0.0
# ===================================================================

# ===================================================================
# PLAYER ACTIVITY SNAPSHOT MODEL
# ===================================================================

type PlayerActivitySnapshot
  @model(subscriptions: null)
  @auth(rules: [{ allow: private }]) {
  
  # === PRIMARY KEY ===
  # Format: DAILY_2025-02-01, WEEKLY_2025-W05, MONTHLY_2025-02
  id: ID!
  
  # === SNAPSHOT METADATA ===
  snapshotType: SnapshotPeriodType! @index(name: "bySnapshotType", sortKeyFields: ["snapshotDate"])
  snapshotDate: AWSDateTime!
  
  # Period keys for filtering/grouping
  dateKey: String @index(name: "byDateKey")    # 2025-02-01 (daily only)
  weekKey: String @index(name: "byWeekKey")    # 2025-W05
  monthKey: String @index(name: "byMonthKey")  # 2025-02
  
  # Processing mode that generated this snapshot
  mode: String  # "DAILY" or "DAILY + MONTHLY"
  
  # === TOTALS ===
  totalPlayers: Int @default(value: "0")
  totalPlayerVenues: Int @default(value: "0")
  
  # ===================================================================
  # TARGETING CLASSIFICATION DISTRIBUTIONS
  # ===================================================================
  # JSON maps of PlayerTargetingClassification -> count
  # Example: { "Active_EL": 2500, "Retain_Inactive31_60d": 800, ... }
  
  playerTargetingDistribution: AWSJSON
  playerVenueTargetingDistribution: AWSJSON
  
  # Transitions that occurred (changes only)
  # JSON maps of "FromCategory → ToCategory" -> count
  # Example: { "Active_EL → Retain_Inactive31_60d": 45, ... }
  playerTargetingTransitions: AWSJSON
  playerVenueTargetingTransitions: AWSJSON
  
  # Update counts
  playerTargetingUpdated: Int @default(value: "0")
  playerVenueTargetingUpdated: Int @default(value: "0")
  
  # Per-venue breakdown for PlayerVenue targeting
  # JSON: { "venueId": { "Active_EL → Retain_Inactive31_60d": count, ... }, ... }
  venueTargetingBreakdown: AWSJSON
  
  # ===================================================================
  # ACCOUNT CATEGORY DISTRIBUTIONS (Monthly runs only)
  # ===================================================================
  # JSON maps of PlayerAccountCategory -> count
  # Example: { "VIP": 121, "REGULAR": 85, "COMMITTED": 292, "CASUAL": 5947, "TRIALIST": 146 }
  
  accountCategoryDistribution: AWSJSON
  accountCategoryTransitions: AWSJSON
  accountCategoryUpdated: Int @default(value: "0")
  
  # VIP stats by entity
  # JSON: { "entityId": { "threshold": 10910, "vipCount": 63, "totalPlayers": 1251 }, ... }
  totalVIPs: Int
  vipStatsByEntity: AWSJSON
  
  # ===================================================================
  # AGGREGATE TRACKING (for weekly/monthly rollups)
  # ===================================================================
  firstDailySnapshot: String   # First daily snapshot included in aggregate
  lastDailySnapshot: String    # Most recent daily snapshot in aggregate
  dailySnapshotCount: Int      # Number of daily snapshots aggregated
  
  # ===================================================================
  # METADATA
  # ===================================================================
  totalErrors: Int @default(value: "0")
  executionTimeMs: Int
  generatedBy: String @default(value: "refreshTargetingClassifications")
  
  # === AUDIT ===
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}